<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - FitChecker Calisthenics</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>🔥 Ciao, <span id="username">...</span>!</h1>
            
            <div class="streak-card">
                <div class="streak-number" id="streak">0</div>
                <div class="streak-label">giorni consecutivi</div>
                <div class="streak-fire">🔥</div>
            </div>
            
            <div class="menu">
                <a href="/exercises" class="btn">💪 Esercizi</a>
                <a href="/workout" class="btn">📅 La mia scheda</a>
                <a href="/nutrition" class="btn">🥗 Alimentazione</a>
                <a href="/progress" class="btn">📈 Progressi</a>
            </div>
            
            <a href="#" id="logoutBtn" class="btn-logout">🚪 Logout</a>
        </div>
    </div>
    
    <script>
        async function loadUserData() {
            try {
                const response = await fetch('/api/me');
                const user = await response.json();
                
                document.getElementById('username').textContent = user.username;
                document.getElementById('streak').textContent = user.streak;
            } catch (err) {
                console.error('Errore:', err);
                window.location.href = '/login';
            }
        }
        
        document.getElementById('logoutBtn')?.addEventListener('click', async (e) => {
            e.preventDefault();
            await fetch('/api/logout');
            window.location.href = '/login';
        });
        
        loadUserData();
    </script>
</body>
</html>
